<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ausgesteckt Kalender</title>

<style>

body{
font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
background:#f6f7fb;
margin:0;
text-align:center;
display:flex;
align-items:center;
justify-content:center;
height:100vh;
}

.container{
background:white;
padding:40px;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,0.08);
max-width:420px;
width:90%;
}

h1{
margin-top:0;
font-size:28px;
}

p{
color:#666;
}

.status{
margin:25px 0;
font-size:16px;
}

.badges img{
height:60px;
margin:10px;
transition:0.2s;
}

.badges img:hover{
transform:scale(1.05);
}

.footer{
margin-top:25px;
font-size:13px;
color:#888;
}

.footer a{
color:#666;
margin:0 8px;
text-decoration:none;
}

.footer a:hover{
text-decoration:underline;
}

</style>

<script>

// Store Links
const APPLE_URL = "https://apps.apple.com/us/app/ausgesteckt-kalender/id6759669189/";
const GOOGLE_URL = "https://play.google.com/store/apps/details?id=com.heurigenkalender.app;

// Geräte erkennen
function isIOS(){
return /iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function isAndroid(){
return /Android/i.test(navigator.userAgent);
}

window.addEventListener("load", ()=>{

const status = document.getElementById("status");

if(isIOS()){
status.textContent="iPhone erkannt – Weiterleitung zum Apple App Store…";

setTimeout(()=>{
window.location.href = APPLE_URL;
},700);
}

else if(isAndroid()){
status.textContent="Android erkannt – Weiterleitung zu Google Play…";

setTimeout(()=>{
window.location.href = GOOGLE_URL;
},700);
}

else{
status.textContent="Bitte wähle deinen Store:";
}

});

</script>

</head>

<body>

<div class="container">

<h1>Ausgesteckt Kalender</h1>

<p>Lade dir die App herunter.</p>

<div id="status" class="status">
Gerät wird erkannt...
</div>

<div class="badges">

<a id="appleBtn" href="#">
<img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg">
</a>

<a id="googleBtn" href="#">
<img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg">
</a>

</div>

<div class="footer">
<a href="impressum.html">Impressum</a>
<a href="datenschutz.html">Datenschutz</a>
</div>

</div>

<script>

document.getElementById("appleBtn").href = APPLE_URL;
document.getElementById("googleBtn").href = GOOGLE_URL;

</script>

</body>
</html>
